<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register &middot; NuraHub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="d-flex align-items-center justify-content-center vh-100 auth-bg">
  <div class="card shadow-lg auth-card">
    <div class="card-body p-4">
      <h3 class="card-title mb-3 text-center">Create Account</h3>

      <div id="registerAlert" class="alert d-none" role="alert"></div>

      <form id="registerForm" novalidate>
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" class="form-control" id="username" name="username" required minlength="3" maxlength="30">
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" name="email" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" name="password" required minlength="8">
          <div class="form-text">At least 8 characters.</div>
        </div>
        <button type="submit" class="btn btn-dark w-100" id="registerBtn">Register</button>
      </form>

      <p class="text-center mt-3 mb-0">
        Already have an account? <a href="login.html">Log in</a>
      </p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="js/register.js"></script>
</body>
</html>
