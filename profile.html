<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile &middot; NuraHub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-3">
  <span class="navbar-brand mb-0 h1">NuraHub</span>
  <button id="logoutBtn" class="btn btn-outline-light btn-sm">Log Out</button>
</nav>

<div class="container py-4">
  <div id="profileAlert" class="alert d-none" role="alert"></div>

  <div class="row g-4">
    <div class="col-md-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title">Account</h5>
          <p class="mb-1"><strong>Username:</strong> <span id="acctUsername">—</span></p>
          <p class="mb-1"><strong>Email:</strong> <span id="acctEmail">—</span></p>
          <p class="mb-0"><strong>Member since:</strong> <span id="acctCreated">—</span></p>
        </div>
      </div>
    </div>

    <div class="col-md-8">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title mb-3">Your Profile</h5>
          <form id="profileForm" novalidate>
            <div class="mb-3">
              <label for="name" class="form-label">Full Name</label>
              <input type="text" class="form-control" id="name" maxlength="100">
            </div>
            <div class="mb-3">
              <label for="age" class="form-label">Age</label>
              <input type="number" class="form-control" id="age" min="0" max="130">
            </div>
            <div class="mb-3">
              <label for="bio" class="form-label">Bio</label>
              <textarea class="form-control" id="bio" rows="3" maxlength="500"></textarea>
            </div>
            <div class="mb-3">
              <label for="interests" class="form-label">Interests (comma separated)</label>
              <input type="text" class="form-control" id="interests" placeholder="football, coding, fitness">
            </div>
            <button type="submit" class="btn btn-dark" id="saveBtn">Save Profile</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
