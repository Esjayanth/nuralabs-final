<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login &middot; NuraHub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="d-flex align-items-center justify-content-center vh-100 auth-bg">
  <div class="card shadow-lg auth-card">
    <div class="card-body p-4">
      <h3 class="card-title mb-3 text-center">Welcome Back</h3>

      <div id="loginAlert" class="alert d-none" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="identifier" class="form-label">Username or Email</label>
          <input type="text" class="form-control" id="identifier" name="identifier" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-dark w-100" id="loginBtn">Log In</button>
      </form>

      <p class="text-center mt-3 mb-0">
        Don't have an account? <a href="register.html">Register</a>
      </p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="js/login.js"></script>
</body>
</html>
